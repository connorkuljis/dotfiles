---
- name: Ensure dotfiles directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/share/dotfiles"
    state: directory
  become: false

- name: Ensure local bin directory exists
  ansible.builtin.file:
    path: "{{ lookup('env', 'HOME') }}/.local/bin"
    state: directory
    mode: '0755'
  become: false

- name: Copy dotfiles directory (only changed files)
  ansible.builtin.synchronize:
    src: "{{ playbook_dir }}/dotfiles/"
    dest: "{{ lookup('env', 'HOME') }}/.local/share/dotfiles/"
    delete: yes
    recursive: yes
    times: yes
    checksum: yes
    rsync_opts:
      - "--exclude=nvim/.config/nvim/lazy-lock.json"
  become: false
  register: dotfiles_sync

- name: Find stow packages
  ansible.builtin.find:
    paths: "{{ lookup('env', 'HOME') }}/.local/share/dotfiles"
    file_type: directory
  become: false
  register: stow_packages

- name: Stow each package
  ansible.builtin.command: >-
    stow
    --verbose
    --no-folding
    --adopt
    --dir {{ lookup('env', 'HOME') }}/.local/share/dotfiles
    --target {{ lookup('env', 'HOME') }}
    {{ item.path | basename }}
  register: stow_result
  changed_when: "'LINK' in (stow_result.stdout ~ stow_result.stderr)"
  failed_when: >-
    stow_result.rc != 0
    or 'WARNING!' in (stow_result.stdout ~ stow_result.stderr)
    or 'conflict' in (stow_result.stdout ~ stow_result.stderr)
    or 'All operations aborted' in (stow_result.stdout ~ stow_result.stderr)
  loop: "{{ stow_packages.files }}"
  become: false
